version: 2

# Grouped, monthly updates -- this is a portfolio repo, not a library, so the
# goal is vulnerability visibility rather than staying on the newest patch.
# Each Python ecosystem directory is tracked separately because the projects
# deliberately have independent, isolated dependency sets.
updates:
  - package-ecosystem: "pip"
    directory: "/project-02-cloud-migration/scripts"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/project-04-realtime-ops/pipeline"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/project-04-realtime-ops/simulator"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/project-05-supply-chain-ml/pipelines"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/project-06-governance-ai/functions/anomaly_explainer"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "terraform"
    directory: "/project-01-data-warehouse/infrastructure/terraform"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
